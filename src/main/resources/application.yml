spring:
  application:
    name: smart-tennis-lab-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smarttennislab}
    username: ${DB_USER:stl}
    password: ${DB_PASSWORD:stl}

  jpa:
    hibernate:
      # Flyway es el dueño del esquema; Hibernate solo valida que coincida.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

stl:
  jwt:
    # En producción SIEMPRE por variable de entorno. Este default es solo para desarrollo local.
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-bytes-long}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
