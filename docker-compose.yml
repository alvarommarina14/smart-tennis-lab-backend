services:
  postgres:
    image: postgres:16-alpine
    container_name: stl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smarttennislab
      POSTGRES_USER: stl
      POSTGRES_PASSWORD: stl
    ports:
      - "5432:5432"
    volumes:
      - stl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stl -d smarttennislab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stl-pgdata:
